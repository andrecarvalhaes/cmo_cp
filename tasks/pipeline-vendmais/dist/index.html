<!-- PIPELINE BOARD -->
<main class="board-wrapper">
  <div class="board" id="board">
    <div class="board-loading">Carregando leads...</div>
  </div>
</main>

<!-- LEAD DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <h2 class="modal-title" id="modalTitle">Lead</h2>
        <span class="modal-badge" id="modalStage"></span>
      </div>
      <div class="modal-header-right">
        <button class="btn btn-ghost btn-sm" id="btnDeleteLead" title="Marcar como perdido">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="btnCloseModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- TABS -->
    <div class="modal-tabs" id="modalTabs">
      <button class="tab active" data-tab="principal">Principal</button>
      <button class="tab" data-tab="cadencia">Cadencia</button>
      <button class="tab" data-tab="interacoes">Interacoes</button>
      <button class="tab" data-tab="comentarios">Comentarios</button>
    </div>

    <!-- TAB CONTENT -->
    <div class="modal-body" id="modalBody">

      <!-- TAB: PRINCIPAL -->
      <div class="tab-content active" data-tab="principal">
        <div class="form-section">
          <h3 class="form-section-title">Dados do Lead</h3>
          <div class="form-grid">
            <div class="form-group col-full">
              <label>Nome</label>
              <input type="text" data-field="nome" />
            </div>
            <div class="form-group col-full">
              <label>Posto</label>
              <input type="text" data-field="posto" />
            </div>
            <div class="form-group">
              <label>Telefone</label>
              <input type="tel" data-field="telefone" />
            </div>
            <div class="form-group">
              <label>E-mail</label>
              <input type="email" data-field="email" />
            </div>
            <div class="form-group">
              <label>CNPJ</label>
              <input type="text" data-field="cnpj" />
            </div>
            <div class="form-group">
              <label>Origem</label>
              <input type="text" data-field="origem" readonly />
            </div>
            <div class="form-group">
              <label>Cidade</label>
              <input type="text" data-field="cidade" />
            </div>
            <div class="form-group">
              <label>Estado</label>
              <input type="text" data-field="estado" maxlength="2" />
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: CADENCIA -->
      <div class="tab-content" data-tab="cadencia">
        <div class="form-section">
          <h3 class="form-section-title">Status na Cadencia</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Coluna Atual</label>
              <select data-field="coluna_atual">
                <option value="dia1">Dia 1</option>
                <option value="dia2">Dia 2</option>
                <option value="dia3">Dia 3</option>
                <option value="dia4">Dia 4</option>
                <option value="dia5">Dia 5</option>
              </select>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select data-field="status">
                <option value="ativo">Ativo</option>
                <option value="pausado">Pausado</option>
                <option value="convertido">Convertido</option>
                <option value="perdido">Perdido</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tentativas no Dia</label>
              <input type="number" data-field="tentativas_dia_atual" readonly />
            </div>
            <div class="form-group">
              <label>Ultimo Resultado</label>
              <input type="text" data-field="ultimo_resultado_ligacao" readonly />
            </div>
            <div class="form-group">
              <label>Fonte da Cadencia</label>
              <input type="text" data-field="fonte_cadencia" readonly />
            </div>
            <div class="form-group">
              <label>ID Kommo</label>
              <input type="text" data-field="id_kommo" readonly />
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: INTERACOES -->
      <div class="tab-content" data-tab="interacoes">
        <div class="form-section">
          <h3 class="form-section-title">Historico de Interacoes</h3>
          <div id="interacoesTimeline">
            <div class="empty-text">Selecione um lead para ver interacoes.</div>
          </div>
        </div>
      </div>

      <!-- TAB: COMENTARIOS -->
      <div class="tab-content" data-tab="comentarios">
        <div class="form-section">
          <h3 class="form-section-title">Comentarios</h3>
          <div class="cmt-form">
            <textarea id="comentarioInput" rows="2" placeholder="Adicionar comentario..."></textarea>
            <button class="btn btn-primary btn-sm" id="btnAddComment">Enviar</button>
          </div>
          <div id="comentariosList">
            <div class="empty-text">Nenhum comentario.</div>
          </div>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="btnCancelModal">Cancelar</button>
      <button class="btn btn-primary" id="btnSaveModal">Salvar</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
